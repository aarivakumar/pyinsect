<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training Rig</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#1b2a4a;margin:0;padding:24px}
h1{margin:0 0 4px}.sub{color:#5b6b8a;margin-bottom:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
input,select,button{font-size:1rem;padding:10px 12px;border-radius:10px;border:2px solid #c5d3ea;background:#fff}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.panel{border:2px solid #c5d3ea;border-radius:16px;padding:14px;min-height:160px}
.feature{background:#eef4ff}.validation{background:#eeeefa}
.panel h2{margin:0 0 10px;font-size:1.1rem}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.ph{width:110px}.ph img{width:110px;height:110px;object-fit:cover;border-radius:10px;display:block}
.ph button{font-size:.75rem;padding:3px 6px;margin:3px 2px 0 0}
#st{color:#5b6b8a;margin-top:12px}
</style></head><body>
<h1>Computer (Training Rig)</h1>
<div class="sub">Photo management and training — works with no internet.</div>
<div class="row">
  <input id="label" list="names" placeholder="Label / name" maxlength="40">
  <datalist id="names"></datalist>
  <button id="set">Use this name</button>
  <select id="view"></select>
</div>
<div class="cols">
  <div class="panel feature"><h2>Feature Photo Gallery (<span id="fc">0</span>)</h2><div class="grid" id="f"></div></div>
  <div class="panel validation"><h2>Validation Photo Gallery (<span id="vc">0</span>)</h2><div class="grid" id="v"></div></div>
</div>
<div id="st"></div>
<script>
const $ = id => document.getElementById(id);
let data = { labels: [], current: '' }, shown = '';
const post = (p, q) => fetch(p + '?' + new URLSearchParams(q), { method: 'POST' }).then(r => r.json());
function card(label, split, file) {
  const d = document.createElement('div'); d.className = 'ph';
  const img = document.createElement('img'); img.loading = 'lazy';
  img.src = '/photo?' + new URLSearchParams({ label, split, file });
  const mv = document.createElement('button');
  mv.textContent = split === 'feature' ? '→ Validation' : '→ Feature';
  mv.onclick = async () => { await post('/api/move', { label, split, file }); load(); };
  const del = document.createElement('button'); del.textContent = 'Delete';
  del.onclick = async () => { if (confirm('Delete this photo?')) { await post('/api/delete', { label, split, file }); load(); } };
  d.append(img, mv, del); return d;
}
function draw() {
  const sel = $('view'), names = data.labels.map(l => l.label);
  sel.replaceChildren(...names.map(n => new Option(n, n)));
  if (!names.includes(shown)) shown = names.includes(data.current) ? data.current : (names[0] || '');
  sel.value = shown;
  $('names').replaceChildren(...names.map(n => new Option(n)));
  const l = data.labels.find(x => x.label === shown) || { feature: [], validation: [] };
  $('f').replaceChildren(...l.feature.map(f => card(shown, 'feature', f)));
  $('v').replaceChildren(...l.validation.map(f => card(shown, 'validation', f)));
  $('fc').textContent = l.feature.length; $('vc').textContent = l.validation.length;
  if (document.activeElement !== $('label')) $('label').value = data.current;
  $('st').textContent = 'Saved in training-rig/data/' + (shown || '<name>') + '/ (labels.csv lists every photo)';
}
async function load() {
  try { data = await (await fetch('/api/overview')).json(); draw(); } catch (e) { $('st').textContent = 'Server stopped.'; }
}
$('set').onclick = async () => {
  const r = await post('/api/label', { name: $('label').value });
  if (r.error) alert(r.error); else { shown = r.label; load(); }
};
$('view').onchange = e => { shown = e.target.value; draw(); };
let sig = ''; // only redraw when something changed, so the page doesn't flicker
setInterval(async () => {
  try { const t = await (await fetch('/api/overview')).text(); if (t !== sig) { sig = t; data = JSON.parse(t); draw(); } } catch (e) {}
}, 2000);
load();
</script></body></html>
